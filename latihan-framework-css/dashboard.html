<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - WebGIS SDGs Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-pink-100 border-b shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-lg font-bold text-pink-600">🎀 WebGIS SDGs Tracker</h1>
    <a href="login.html" class="text-sm text-pink-500 hover:underline">Halaman Dashboard</a>
  </header>

  <!-- Content -->
  <div class="flex flex-1">

    <!-- Sidebar -->
    <aside class="w-64 bg-white p-6 border-r border-pink-200">
      <h2 class="text-md font-bold text-pink-600 mb-4">🧁 Filter Kategori</h2>
      <ul class="space-y-2 text-sm text-pink-700">
        <li><input type="checkbox" class="mr-2 accent-pink-500">Pendidikan</li>
        <li><input type="checkbox" class="mr-2 accent-pink-500">Kesehatan</li>
        <li><input type="checkbox" class="mr-2 accent-pink-500">Lingkungan</li>
      </ul>
      <button class="mt-6 bg-pink-100 text-pink-600 font-semibold py-2 px-4 w-full rounded hover:bg-pink-200 transition">Logout</button>
    </aside>

    <!-- Main Section -->
    <main class="flex-1 p-6">
      <!-- Peta -->
      <div class="bg-pink-50 rounded-lg flex">
        <iframe class="mt-4 w-full rounded-md" height="450"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31658.74717143646!2d112.68914447431642!3d-7.315266599999986!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2dd7fb7081be4f83%3A0xa9c00ebea3e64b3d!2sUniversitas%20Negeri%20Surabaya%20-%20Kampus%201!5e0!3m2!1sid!2sid!4v1747572937150!5m2!1sid!2sid"
          style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <!-- Detail Lokasi -->
        <div class="bg-pink-100 p-4 shadow-md rounded-md absolute right-8 bottom-8 w-64 border border-pink-200">
          <h3 class="text-sm font-bold text-pink-700 mb-2">📍 Detail Lokasi</h3>
          <p class="text-sm text-pink-800"><strong>Nama Lokasi:</strong> Universitas Negeri Surabaya</p>
          <p class="text-sm text-pink-800"><strong>Kategori:</strong> Pendidikan</p>
          <p class="text-sm text-pink-800"><strong>Progress SDGs:</strong> 90%</p>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
