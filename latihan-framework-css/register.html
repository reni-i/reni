<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - WebGIS SDGs Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #ffe6f0;
        }

        main.card {
            background-color: #fff0f5;
            border: 2px solid #ffc0cb;
            border-radius: 20px;
        }

        h1 {
            color: #d63384;
            font-weight: bold;
        }

        .form-label {
            color: #c71585;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #ffb6c1;
        }

        .btn-primary {
            background-color: #ff69b4;
            border-color: #ff69b4;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background-color: #ff85c1;
            border-color: #ff85c1;
        }

        a {
            color: #d63384;
        }

        a:hover {
            color: #c71585;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <main class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <h1 class="text-center mb-4">Daftar</h1>
        <form onsubmit="return validateRegisterForm()">
            <div class="mb-3">
                <label for="name" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="name" required />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required />
            </div>
            <div class="mb-3">
                <label for="confirm" class="form-label">Konfirmasi Password</label>
                <input type="password" class="form-control" id="confirm" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Daftar</button>
        </form>
        <p class="text-center mt-3 small">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </main>

    <script>
        function validateRegisterForm() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password.length < 6) {
                alert('Password minimal 6 karakter.');
                return false;
            }

            if (password !== confirm) {
                alert('Konfirmasi password tidak cocok.');
                return false;
            }

            return true;
        }
    </script>

</body>

</html>
