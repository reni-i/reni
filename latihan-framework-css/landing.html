<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing Page - WebGIS SDGs</title>

    <!-- Menambahkan Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header class="bg-pink-100 border-b shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600">WebGIS SDGs</h1>
            <a href="login.html" class="text-sm bg-pink-500 text-white px-4 py-2 rounded hover:bg-pink-600 transition">
                Logout
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <main
        class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-16 text-center bg-gradient-to-b from-pink-50 to-white">
        <div class="max-w-2xl">
            <div class="text-6xl mb-6">🌸</div>
            <h2 class="text-4xl font-bold text-pink-700 mb-4 leading-snug">
                Selamat Datang di WebGIS SDGs Tracker
            </h2>
            <p class="text-pink-600 text-lg mb-8">
                Pantau dan visualisasikan data pembangunan berkelanjutan di daerahmu. Jelajahi peta interaktif dan bantu wujudkan masa depan yang lebih baik!
            </p>
            <a href="dashboard.html"
                class="inline-block bg-pink-500 hover:bg-pink-600 text-white font-semibold px-6 py-3 rounded-full shadow transition">
                🎀 Lihat Peta Sekarang
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-pink-100 border-t text-center py-4 text-sm text-pink-500">
        &copy; 2025 WebGIS SDGs Tracker. Semua Hak Dilindungi.
    </footer>

</body>

</html>
